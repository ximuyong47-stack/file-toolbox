<script>var API_URL=(typeof CONFIG!=="undefined"&&CONFIG.API_URL)?CONFIG.API_URL:"";async function ghUpload(file){var n=file.name;var b64=await new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result.split(",")[1])};r.readAsDataURL(file)});var resp=await fetch("https://api.github.com/repos/"+CONFIG.GH_USER+"/"+CONFIG.GH_REPO+"/contents/staging/"+encodeURIComponent(n),{method:"PUT",headers:{Authorization:"Bearer "+CONFIG.GH_TOKEN,Accept:"application/vnd.github+json"},body:JSON.stringify({message:"upload "+n,content:b64,branch:"main"})});if(!resp.ok)throw new Error("Upload failed: "+resp.status);return n}

if(outputMode==="merged"){var np=await PDFLib.PDFDocument.create();var cp=await np.copyPages(src,pages);cp.forEach(function(p){np.addPage(p)});var bytes=await np.save();var fname=splitFile.name.replace(/\.pdf$/i,"")+"_selected.pdf";autoDownload(new Blob([bytes],{type:"application/pdf"}),fname);setStatus("split-status","success","宸蹭笅杞藉悎骞?PDF锛?+pages.length+" 椤碉級")}
else{var baseName=splitFile.name.replace(/\.pdf$/i,"");for(var i=0;i<pages.length;i++){var np=await PDFLib.PDFDocument.create();var cp=await np.copyPages(src,[pages[i]]);cp.forEach(function(p){np.addPage(p)});var bytes=await np.save();autoDownload(new Blob([bytes],{type:"application/pdf"}),baseName+"_page"+(pages[i]+1)+".pdf");await new Promise(function(r){setTimeout(r,250)})}setStatus("split-status","success","鎷嗗垎瀹屾垚锛佸凡涓嬭浇 "+pages.length+" 涓嫭绔嬫枃浠?)}
}catch(e){setStatus("split-status","error","鎷嗗垎澶辫触锛?+e.message)}});

document.getElementById("split-clear").addEventListener("click",function(){splitFile=null;splitPageCount=0;renderFileList("split-files",[],function(){});document.getElementById("split-mode-card").style.display="none";document.getElementById("split-page-grid").style.display="none";document.getElementById("split-select-all").style.display="none";document.getElementById("split-deselect-all").style.display="none";updateSplitUI();clearStatus("split-status")});

// ===== 5. Image Convert =====
var imgFile=null,imgDataType=null;
bindDropzone("img-dropzone","img-input",async function(files){imgFile=files[0];var ext=imgFile.name.split(".").pop().toLowerCase();imgDataType=(ext==="pdf")?"pdf":"image";renderFileList("img-files",[imgFile],function(){imgFile=null;imgDataType=null;renderFileList("img-files",[],function(){});updateImgUI();updateImgHint();document.getElementById("img-preview").innerHTML='<span class="placeholder">涓婁紶鏂囦欢鍚庡彲棰勮</span>'});updateImgUI();updateImgHint();await previewImage()});
function updateImgUI(){document.getElementById("img-convert-btn").disabled=!imgFile}
function updateImgHint(){var hint=document.getElementById("img-hint");if(!imgFile){hint.textContent="";return}var srcExt=imgFile.name.split(".").pop().toLowerCase();var target=document.getElementById("img-target").value;if(srcExt===target){hint.textContent="婧愭牸寮忎笌鐩爣鏍煎紡鐩稿悓";hint.style.color="#f59e0b"}else{hint.textContent=""}}
document.getElementById("img-target").addEventListener("change",updateImgHint);

async function previewImage(){if(!imgFile)return;var preview=document.getElementById("img-preview");if(imgDataType==="image"){var url=URL.createObjectURL(imgFile);preview.innerHTML='<img src="'+url+'" alt="preview">'}else{preview.innerHTML='<span class="placeholder">鍔犺浇 PDF 棰勮...</span>';try{if(typeof pdfjsLib==="undefined")throw new Error("PDF.js not loaded");var buf=await imgFile.arrayBuffer();var pdf=await pdfjsLib.getDocument({data:buf}).promise;var page=await pdf.getPage(1);var vp=page.getViewport({scale:1.5});var canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;var ctx=canvas.getContext("2d");await page.render({canvasContext:ctx,viewport:vp}).promise;preview.innerHTML='<img src="'+canvas.toDataURL()+'" alt="PDF preview" style="max-width:100%;">'}catch(e){preview.innerHTML='<span class="placeholder" style="color:#fca5a5;">棰勮澶辫触锛?+e.message+'</span>'}}}

document.getElementById("img-convert-btn").addEventListener("click",async function(){if(!imgFile)return;var target=document.getElementById("img-target").value;var srcExt=imgFile.name.split(".").pop().toLowerCase();if(srcExt===target){setStatus("img-status","error","婧愭牸寮忎笌鐩爣鏍煎紡鐩稿悓锛屾棤闇€杞崲");return}setStatus("img-status","info","姝ｅ湪杞崲...");try{if(imgDataType==="image")await convertImage(imgFile,target);else await convertPdf(imgFile,target);setStatus("img-status","success","杞崲瀹屾垚锛佹枃浠跺凡鑷姩涓嬭浇")}catch(e){setStatus("img-status","error","杞崲澶辫触锛?+e.message)}});

function loadImage(file){return new Promise(function(resolve,reject){var url=URL.createObjectURL(file);var img=new Image();img.onload=function(){URL.revokeObjectURL(url);resolve(img)};img.onerror=function(){reject(new Error("鍥剧墖鍔犺浇澶辫触"))};img.src=url})}
function canvasToBlob(canvas,mime,quality){return new Promise(function(resolve,reject){canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error("Canvas 杞崲澶辫触"))},mime,quality)})}

async function convertImage(file,target){if(target==="pdf"){try{var buf=await file.arrayBuffer();var ext=file.name.split(".").pop().toLowerCase();var pdfDoc=await PDFLib.PDFDocument.create();var img;if(ext==="png"){img=await pdfDoc.embedPng(buf)}else{img=await pdfDoc.embedJpg(buf)};var pw=img.width*25.4/96;var ph=img.height*25.4/96;var page=pdfDoc.addPage([pw,ph]);page.drawImage(img,{x:0,y:0,width:pw,height:ph});var pdfBytes=await pdfDoc.save();var blob=new Blob([pdfBytes],{type:"application/pdf"});autoDownload(blob,file.name.replace(/\.[^.]+$/,".pdf"))}catch(e){setStatus("img-status","error","PDF鐢熸垚澶辫触: "+e.message);return}}else{var img=await loadImage(file);var canvas=document.createElement("canvas");canvas.width=img.width;canvas.height=img.height;var ctx=canvas.getContext("2d");ctx.drawImage(img,0,0);var mime=target==="jpg"?"image/jpeg":"image/png";var blob=await canvasToBlob(canvas,mime,target==="jpg"?0.92:undefined);autoDownload(blob,file.name.replace(/\.[^.]+$/,"."+target))}}

async function convertPdf(file,target){var buf=await file.arrayBuffer();if(typeof pdfjsLib==="undefined")throw new Error("PDF.js not loaded");var pdf=await pdfjsLib.getDocument({data:buf}).promise;var page=await pdf.getPage(1);var vp=page.getViewport({scale:2});var canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;var ctx=canvas.getContext("2d");await page.render({canvasContext:ctx,viewport:vp}).promise;var mime=target==="jpg"?"image/jpeg":"image/png";var blob=await canvasToBlob(canvas,mime,target==="jpg"?0.92:undefined);var fname=(file.name.replace(/\.pdf$/i,"")||"page")+"."+target;autoDownload(blob,fname)}

document.getElementById("img-clear").addEventListener("click",function(){imgFile=null;imgDataType=null;renderFileList("img-files",[],function(){});document.getElementById("img-preview").innerHTML='<span class="placeholder">涓婁紶鏂囦欢鍚庡彲棰勮</span>';updateImgUI();updateImgHint();clearStatus("img-status")});

});

// docx-preview override for Word preview
var _origPreviewDoc = previewDoc;
previewDoc = async function(){
  if(!docFile) return;
  var ext = docFile.name.split('.').pop().toLowerCase();
  if(ext !== 'docx' || typeof docx === 'undefined') return _origPreviewDoc();
  clearStatus('doc-status');
  var p = document.getElementById('doc-preview');
  p.innerHTML = '<span class=\"placeholder\">鍔犺浇棰勮涓?..</span>';
  try {
    var buf = await docFile.arrayBuffer();
    // Get mammoth HTML for printing
    var mr = await mammoth.convertToHtml({arrayBuffer: buf});
    docHtmlContent = mr.value;
    // Render with docx-preview for screen
    p.innerHTML = '';
    p.style.cssText = 'display:block;overflow:auto;background:#fff;color:#000;padding:0;min-height:200px';
    await docx.renderAsync(buf, p, null, {breakPages: true, ignoreFonts: false, ignoreWidth: false, ignoreHeight: false, renderHeaders: false, renderFooters: false, renderFootnotes: false, renderEndnotes: false});
  } catch(e) { return _origPreviewDoc(); }
};
